<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenk et lys</title>
    <style>
        /* Nullstiller standardmarginer og bokssetting */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #111318;
            color: #e9e5dc;
            font-family: Georgia, "Times New Roman", serif;
        }

        /* Hovedkortet – holder alt samlet */
        .container {
            width: min(100%, 440px);
            padding: 42px 34px 30px;
            text-align: center;
            background: #1a1c21;
            border: 1px solid #30333a;
            border-radius: 18px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, .28);
        }

        h1 {
            font-size: 1.65rem;
            font-weight: 400;
            letter-spacing: .06em;
            color: #f0ece3;
        }

        .subtitle {
            margin-top: 9px;
            padding-bottom: 22px;
            border-bottom: 1px solid #30333a;
            color: #9d9b96;
            font-size: .92rem;
        }

        /* Klikkbart område rundt lyset */
        .candle-area {
            display: inline-block;
            margin: 34px auto 26px;
            padding: 12px;
            cursor: pointer;
            outline: none;
            border-radius: 50%;
        }

        /* Fokusmarkering for tastaturnavigasjon */
        .candle-area:focus-visible {
            box-shadow: 0 0 0 2px #aaa18e;
        }

        /* Selve lyset */
        .candle {
            position: relative;
            width: 116px;
            height: 116px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: #303238;
            border: 1px solid #44474e;
            transition: background .35s ease, box-shadow .35s ease, transform .2s ease;
        }

        /* Liten trykk-effekt for bedre tilbakemelding */
        .candle-area:active .candle {
            transform: scale(.97);
        }

        /* Veken, den lille tuppen i toppen */
        .wick {
            position: absolute;
            top: 18px;
            left: 50%;
            width: 5px;
            height: 19px;
            transform: translateX(-50%);
            border-radius: 3px 3px 1px 1px;
            background: #18191c;
            z-index: 2;
        }

        /* Flammen er usynlig når lyset er slukket */
        .flame {
            position: absolute;
            top: -14px;
            left: 50%;
            width: 27px;
            height: 38px;
            transform: translateX(-50%);
            transform-origin: 50% 100%;
            opacity: 0;
            border-radius: 55% 45% 55% 45%;
            background: #e9a63b;
            box-shadow: 0 0 18px rgba(235, 164, 56, .55);
            transition: opacity .35s ease;
            z-index: 3;
        }

        /* Indre glød i flammen */
        .flame::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 5px;
            width: 10px;
            height: 17px;
            transform: translateX(-50%);
            border-radius: 50% 50% 45% 45%;
            background: #ffe7a0;
        }

        .candle.tent {
            background: #d6b965;
            border-color: #e2ca7e;
            box-shadow: 0 0 28px rgba(218, 184, 89, .30);
        }

        .candle.tent .flame {
            opacity: 1;
            animation: flame 1.7s ease-in-out infinite alternate;
        }

        /* Flicker-effekt som gir flammen liv */
        @keyframes flame {
            from {
                transform: translateX(-50%) rotate(-2deg) scale(1);
            }
            to {
                transform: translateX(-50%) rotate(2deg) scale(1.06, .96);
            }
        }

        /* Teller for antall tenninger */
        .counter {
            color: #9d9b96;
            font-size: .92rem;
        }

        .counter span {
            display: block;
            margin-top: 6px;
            color: #eee4c5;
            font-size: 2.35rem;
            font-weight: 400;
            line-height: 1;
        }

        /* Nullstill-knapp */
        .reset-btn {
            margin-top: 22px;
            padding: 8px 17px;
            border: 1px solid #3a3d44;
            border-radius: 6px;
            background: transparent;
            color: #aaa9a5;
            font: inherit;
            font-size: .78rem;
            cursor: pointer;
            transition: background .2s, color .2s, border-color .2s;
        }

        .reset-btn:hover {
            background: #24272d;
            color: #eeeae2;
            border-color: #565a62;
        }

        .hint {
            margin-top: 16px;
            color: #777873;
            font-size: .76rem;
            font-style: italic;
        }

        .footer {
            margin-top: 18px;
            color: #676963;
            font-size: .68rem;
        }

        /* Litt tettere på små skjermer */
        @media (max-width: 480px) {
            body {
                padding: 16px;
            }
            .container {
                padding: 34px 22px 26px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Til minne</h1>
        <div class="subtitle">Klikk for å tenne et lys</div>

        <!-- Klikkefeltet som gjør hele området responsivt -->
        <div class="candle-area" id="candleArea" tabindex="0" role="button" aria-label="Tenn et lys">
            <div class="candle" id="candle">
                <div class="wick"></div>
                <div class="flame"></div>
            </div>
        </div>

        <div class="counter">
            Tente lys i dag
            <span id="countDisplay">0</span>
        </div>

        <button class="reset-btn" id="resetBtn">Nullstill teller</button>
        <div class="hint">— ett lys for hvert klikk —</div>
    </div>

    <div class="footer">🇳🇴</div>

    <script>
        // Henter elementene vi trenger å manipulere
        const candle = document.getElementById("candle");
        const candleArea = document.getElementById("candleArea");
        const countDisplay = document.getElementById("countDisplay");
        const resetBtn = document.getElementById("resetBtn");

        // Henter lagret teller fra nettleseren, eller starter på 0
        let count = parseInt(localStorage.getItem("candleCount"), 10) || 0;
        // Sjekker om lyset var tent ved forrige besøk
        let isLit = localStorage.getItem("candleIsLit") === "true";

        // Oppdaterer både visning og lagring
        function updateUI() {
            countDisplay.textContent = count;
            candle.classList.toggle("tent", isLit);
            localStorage.setItem("candleCount", String(count));
            localStorage.setItem("candleIsLit", String(isLit));
        }

        // Kjernefunksjonen som tenner eller slukker lyset
        function lightCandle() {
            if (!isLit) {
                isLit = true;
                count += 1; // teller kun opp når vi tenner fra slukket
            } else {
                isLit = false;
            }
            updateUI();
        }

        // Klikk på lyset
        candleArea.addEventListener("click", lightCandle);

        // Tastaturstøtte for Enter og mellomrom
        candleArea.addEventListener("keydown", function(e) {
            if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                lightCandle();
            }
        });

        // Nullstiller telleren og ber om bekreftelse først
        resetBtn.addEventListener("click", function() {
            if (confirm("Nullstill antall tennte lys? Dette kan ikke angres.")) {
                count = 0;
                updateUI();
            }
        });

        // Setter starttilstand
        updateUI();
    </script>

</body>
</html>
